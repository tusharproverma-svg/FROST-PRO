name: Build FROST APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip source
        run: |
          if [ -f frost-android-src.zip ]; then unzip -o frost-android-src.zip -d src; else mkdir -p src && cp -r . src/ 2>/dev/null || true; fi
          D=$(dirname "$(find src -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(find "$PROJ" -name app-debug.apk | head -1)" FROST.apk
          gh release create v${{ github.run_number }} FROST.apk --title "FROST APK v${{ github.run_number }}" --notes "डाउनलोड करके इंस्टॉल कीजिए"
